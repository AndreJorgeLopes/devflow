# create-pr determinism assertions (Axis B — pin the PR-body output shape).
# SIDE-EFFECT skill: eval-run.sh sets DEVFLOW_EVAL=1, so the shared runner isolates it in a
# throwaway git fixture (a feature branch 1 commit ahead of main, no remote) and the skill prints
# the assembled PR title + body WITHOUT pushing or opening a PR.
# Run: make determinism SKILL=create-pr
description: create-pr determinism assertions

prompts:
  - '{{input}}'

providers:
  - id: 'exec: bash eval-run.sh'
    label: create-pr@head

# One test case, all asserts — each test case re-runs the whole (expensive) skill, so keep it to
# a single invocation.
tests:
  - description: "PR body shape: TL;DR, headings, no em-dashes, not fence-wrapped"
    vars: { input: '/devflow:create-pr' }
    assert:
      - type: icontains
        value: 'TL;DR'
      - type: not-icontains
        value: '—'
      - type: regex
        value: '(^|\n)#{1,3} '
      - type: not-icontains
        value: "```\n## TL;DR"
