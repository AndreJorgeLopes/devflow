# OTel Collector — receives Claude Code OTLP on :4318 (no auth, localhost), adds the
# Langfuse Basic-auth header, forwards traces to the Langfuse v3 OTLP endpoint.
# Keeps the Langfuse secret OUT of Claude Code's (tracked) settings.json — it lives
# only in docker/.env (gitignored) as LANGFUSE_OTEL_BASIC_AUTH.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  batch:
    timeout: 5s

exporters:
  # Langfuse appends /v1/traces to this base path.
  otlphttp/langfuse:
    endpoint: http://langfuse-web:3000/api/public/otel
    headers:
      Authorization: "Basic ${env:LANGFUSE_OTEL_BASIC_AUTH}"
  debug:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/langfuse, debug]
